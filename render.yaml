services:
  # ============================================================
  # Express Backend REST API & Trust Gateway (Render Web Service)
  # ============================================================
  - type: web
    name: nep-academic-credit-hub-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set securely in Render Dashboard to your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Generates a cryptographically strong 64-char key on Render
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true # Generates a separate cryptographic key for refresh tokens
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://nep-academic-credit-hub-client.onrender.com
      - key: GATEWAY_SECRET_SALT
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # Set securely in Render Dashboard to override default fallback

  # ============================================================
  # React / Vite Frontend (Render Static Site)
  # ============================================================
  - type: web
    name: nep-academic-credit-hub-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule so React Router deep paths don't 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nep-academic-credit-hub-api.onrender.com/api/v1
      - key: VITE_GATEWAY_URL
        value: https://nep-academic-credit-hub-api.onrender.com/api/v1/gateway
      - key: VITE_APP_NAME
        value: NEP Academic Credit Hub
